# Fly.io configuration for the FastAPI backend.
#
# First deploy:
#   fly launch --no-deploy --name meal-planner-api --region ord
#   fly secrets set MEAL_PLANNER_DB_URL="postgresql+psycopg://..."
#   fly secrets set MEAL_PLANNER_CORS_ORIGINS="https://your-frontend.vercel.app"
#   fly deploy
#
# ord (Chicago) is the closest Fly region to Neon's us-east-2 (Ohio), which
# keeps the API-to-database hop to a few milliseconds. That matters more
# than the API's distance from any one user, because a page load makes a
# single API request but the API makes several database queries.

app = "meal-planner-api"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine always running, so visitors never pay a container cold start
  # on top of everything else.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
