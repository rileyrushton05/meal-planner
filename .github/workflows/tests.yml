name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The frontend has been linted since it was written; this holds the Python
  # to the same standard. It caught a duplicated import and a handful of
  # over-long lines the moment it was switched on.
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Typecheck
        run: pyright

  # The suite runs twice: once on SQLite (what local development uses) and
  # once on Postgres (what production runs). Passing both is what proves the
  # data layer is genuinely portable rather than accidentally SQLite-shaped.
  pytest:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Empty for the SQLite leg, which makes conftest fall back to
          # per-test temporary files.
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/mealplanner_test' || '' }}
          # Without this, an empty URL on the Postgres leg would fall back to
          # SQLite and pass, proving nothing about Postgres.
          REQUIRE_TEST_DATABASE: ${{ matrix.database == 'postgres' && '1' || '' }}
        run: pytest -q --cov --cov-report=term

  # The frontend is a separate toolchain, so the Python jobs above cannot
  # catch a type error or a broken build in web/. Without this a TypeScript
  # mistake would only surface during the Vercel deploy.
  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # docs/openapi.json is checked against the API by pytest; this checks
      # the TypeScript generated from it, so a contract change cannot ship
      # with stale frontend types.
      - name: Generated API types are current
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.ts

      - name: Test with coverage
        run: npm run test:coverage

      # `npm run build` runs `tsc -b` first, so this typechecks as well.
      - name: Typecheck and build
        run: npm run build

  # The production build in a real browser against the real API, on a fresh
  # SQLite database. The unit suites test components in jsdom; this proves
  # the assembled app works.
  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        working-directory: .
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Traces and screenshots of any failure, viewable with
      # `npx playwright show-trace`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Guards against the migrations and the models drifting apart. The tests
  # build their schema from the models for speed, so without this a model
  # change could ship with no matching migration and only fail in production.
  migrations:
    name: migrations match models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealplanner_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MEAL_PLANNER_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mealplanner_migrations

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply every migration from scratch
        run: alembic upgrade head

      - name: Fail if the models imply an unwritten migration
        run: alembic check

      - name: Check migrations are reversible
        run: alembic downgrade base
