[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "1.0.0"
description = "Weekly meal planner that turns a week of meals into a consolidated grocery list."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Mirrored in requirements.txt, which is what Streamlit Community Cloud
# installs from. Update both together.
dependencies = [
    "streamlit==1.55.0",
    "sqlmodel==0.0.37",
    "streamlit-searchbox==0.1.24",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["app", "ui", "ui.tabs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working straight from a clone, before `pip install -e .`.
pythonpath = ["."]
