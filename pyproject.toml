[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "1.0.0"
description = "Weekly meal planner that turns a week of meals into a consolidated grocery list."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Mirrored in requirements.txt and api/requirements.txt, which are what the
# deployment installs from; tests/test_packaging.py fails if they drift.
# Shared by every entry point: the domain layer and its storage.
dependencies = [
    "sqlmodel==0.0.48",
    # Postgres driver, needed wherever MEAL_PLANNER_DB_URL points at Neon.
    "psycopg[binary]==3.3.8",
    # Schema migrations, applied automatically at application startup.
    "alembic==1.20.1",
    # argon2id password hashing (app/security.py).
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
# The HTTP API consumed by the React frontend. Deployed on its own.
api = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    # Error tracking (server/monitoring.py); off unless SENTRY_DSN is set.
    "sentry-sdk==2.73.0",
]
dev = [
    "meal-planner[api]",
    "pytest==9.2.0",
    # Drives the API in tests via fastapi.testclient.
    "httpx==0.28.1",
    # Loads .env for local work; deployments use real environment variables.
    "python-dotenv==1.2.4",
    # Lint and format. The frontend has had both since it was written; this
    # keeps the Python held to the same standard rather than a lower one.
    "ruff==0.17.3",
    # Static type checking for app/ and server/, run in CI.
    "pyright==1.1.414",
    # Coverage, with a floor in [tool.coverage.report] that CI enforces.
    "pytest-cov==7.1.0",
]

[tool.setuptools]
packages = ["app", "server", "server.routers"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Beyond the defaults (pyflakes + a subset of pycodestyle): import ordering,
# bugbear's real-bug checks, comprehension and modernisation rules.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixtures and parametrised cases legitimately shadow names and go long.
"tests/*" = ["E501"]
# Alembic generates these; leave the generated shape alone.
"migrations/versions/*" = ["E501", "I001"]

[tool.pyright]
# Application code only. The tests lean on fixtures and monkeypatching,
# where strict typing costs more than it catches.
include = ["app", "server"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["app", "server"]

[tool.coverage.report]
# Just under the measured 97%, so coverage cannot fall without CI saying so.
# Raise it as it rises; never lower it to make a build pass.
fail_under = 95
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working straight from a clone, before `pip install -e .`.
pythonpath = ["."]
