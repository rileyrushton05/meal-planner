[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "1.0.0"
description = "Weekly meal planner that turns a week of meals into a consolidated grocery list."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Mirrored in requirements.txt, which is what Streamlit Community Cloud
# installs from. Update both together.
# Shared by every entry point: the domain layer and its storage.
dependencies = [
    "sqlmodel==0.0.37",
    # Postgres driver, needed wherever MEAL_PLANNER_DB_URL points at Neon.
    "psycopg[binary]==3.3.4",
    # Schema migrations, applied automatically at application startup.
    "alembic==1.19.1",
]

[project.optional-dependencies]
# The HTTP API consumed by the React frontend. Deployed on its own.
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
]
dev = [
    "meal-planner[api]",
    "pytest==9.1.1",
    # Drives the API in tests via fastapi.testclient.
    "httpx==0.28.1",
    # Loads .env for local work; deployments use real environment variables.
    "python-dotenv==1.2.3",
]

[tool.setuptools]
packages = ["app", "server", "server.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working straight from a clone, before `pip install -e .`.
pythonpath = ["."]
